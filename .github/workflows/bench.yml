name: benchmarks

# Re-run the benchmarks on every merge to main and publish the results as
# docs/PERFORMANCE.md, so the page always has the numbers for main's current
# commit.
#
# The commit this job makes carries [skip ci] and only changes the files listed
# in paths-ignore, so it doesn't start another run. It pushes to main, which is
# why it needs `contents: write`.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/PERFORMANCE.md'
      - 'dev/benchmarks/results.csv'
      - 'dev/benchmarks/environment.txt'
      - 'dev/benchmarks/compilespeed.txt'
      - 'dev/benchmarks/scaling.txt'
  workflow_dispatch:

# One benchmark run at a time, so two runs don't race to push their numbers.
concurrency:
  group: benchmarks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    # Nothing in bench.sh or runstat puts a time limit on a single run, and two
    # of the benchmarks (nethttp and nethttps) fetch from a local server over a
    # socket. The job timeout stops a hung run from going to the six-hour
    # default, with plenty of room for a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ubuntu-latest already has gcc, g++, rustc, go, python3 and node. They're
      # only here to be compared against: bench.sh skips a language it can't
      # find, and word doesn't need any of them. bench.sh writes the machine and
      # each toolchain's version to environment.txt, which goes onto the page
      # with the numbers.
      #
      # bench.sh exits 1 when a benchmark fails to build, fails to run, or gives
      # a different answer from the other languages. compilespeed.sh and
      # scaling.sh exit 1 when a build or a run fails, and scaling.sh also when a
      # program prints something other than the answer it expects. Any of those
      # stops the job here, so a failed run never reaches the page. The last two
      # print their tables to stdout, which goes to a file, so they report a
      # failure on stderr where this log shows it.
      - name: run the benchmark suite
        run: |
          sh dev/benchmarks/bench.sh
          sh dev/benchmarks/compilespeed.sh > dev/benchmarks/compilespeed.txt
          sh dev/benchmarks/scaling.sh > dev/benchmarks/scaling.txt

      - name: show the machine and the toolchain versions
        run: cat dev/benchmarks/environment.txt

      - name: render docs/PERFORMANCE.md
        run: sh dev/benchmarks/mkperf.sh

      # The same page in the run summary, so the numbers can be read from the
      # Actions tab.
      - name: publish to the run summary
        run: cat docs/PERFORMANCE.md >> "$GITHUB_STEP_SUMMARY"

      - name: commit the refreshed numbers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="docs/PERFORMANCE.md dev/benchmarks/results.csv
                 dev/benchmarks/environment.txt
                 dev/benchmarks/compilespeed.txt dev/benchmarks/scaling.txt"

          git add $files
          if git diff --cached --quiet; then
            echo "nothing moved"
            exit 0
          fi

          # Save the new files outside the work tree, so a retry can put them
          # back after resetting to a newer main.
          saved=$(mktemp -d)
          for f in $files; do
            mkdir -p "$saved/$(dirname "$f")"
            cp "$f" "$saved/$f"
          done

          record() {
            git add $files
            if git diff --cached --quiet; then
              echo "main already carries these numbers"
              exit 0
            fi
            git commit -m "Benchmarks for ${GITHUB_SHA:0:7} [skip ci]" \
                       -m "Regenerated by .github/workflows/bench.yml. Absolute times are from whatever shared runner this job landed on; the number that carries meaning across runs is word's time next to a gcc -O2 binary measured beside it."
          }
          record

          # If a merge lands on main between checkout and push, the push is
          # rejected. Rebasing this commit would make git merge two generated
          # tables, which conflicts, so instead reset to the new main, copy this
          # run's files over it and commit again. Three tries, then fail.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main || exit 1
            git reset --hard FETCH_HEAD || exit 1
            for f in $files; do cp "$saved/$f" "$f"; done
            record
          done
          exit 1
